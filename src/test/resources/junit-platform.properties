# ---------------------------------------------------------------------------
# Configuracion del motor Cucumber sobre la JUnit Platform.
# ---------------------------------------------------------------------------

# Paquete donde Cucumber busca las definiciones de pasos (glue code).
cucumber.glue=cl.taller.qa.bdd.steps

# Reportes generados en cada ejecucion:
#   pretty  -> salida legible en consola / logs del pipeline
#   html    -> REPORTE NAVEGABLE que se publica como artefacto de CI
#   json    -> insumo para dashboards y reportes agregados
#   junit   -> XML estandar que GitHub Actions y Jenkins entienden nativamente
cucumber.plugin=pretty, html:target/cucumber-reports/reporte-bdd.html, json:target/cucumber-reports/cucumber.json, junit:target/cucumber-reports/cucumber-junit.xml

# Un paso sin implementar debe romper el build, nunca pasar silenciosamente.
cucumber.execution.strict=true

# Evita el aviso de publicacion en el servicio en la nube de Cucumber.
cucumber.publish.quiet=true

# Nombres legibles de los escenarios en el reporte.
cucumber.junit-platform.naming-strategy=long
