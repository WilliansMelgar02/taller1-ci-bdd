# =============================================================================
#  Pipeline de Integración Continua — Taller 1, Unidad II
#
#  Estrategia: "fail fast, feedback rápido".
#  Las etapas se ordenan de la más barata a la más cara, de modo que un error
#  trivial (compilación o prueba unitaria) detiene el pipeline en segundos y no
#  consume tiempo de agente ejecutando pruebas de aceptación.
#
#      compilar ──► pruebas unitarias ──► pruebas BDD ──► publicar reportes
#         5 s              3 s                8 s              ~20 s
# =============================================================================
name: CI - Pruebas Automatizadas

# ---------------------------------------------------------------------------
# Disparadores: cada push a main o a una rama feature, y cada Pull Request.
# Esto materializa la práctica de integración continua: nadie integra código
# sin que la suite completa se haya ejecutado antes.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # permite ejecución manual desde la pestaña Actions

# Si se empuja dos veces seguidas a la misma rama, se cancela la ejecución
# anterior: evita gastar minutos de CI en un commit que ya quedó obsoleto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write             # publicar los resultados como "checks" del commit
  pull-requests: write      # comentar el resumen en el Pull Request

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:

  # ===========================================================================
  # ETAPA 1 — Compilación y pruebas unitarias (rápidas y atómicas)
  # ===========================================================================
  pruebas-unitarias:
    name: 1 · Compilación y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven          # cachea ~/.m2 y acorta el build de minutos a segundos

      - name: Compilar el proyecto
        run: mvn -B -ntp clean compile

      - name: Ejecutar pruebas unitarias (Surefire)
        run: mvn -B -ntp test

      - name: Publicar resultados como check del commit
        uses: mikepenz/action-junit-report@v5
        if: always()            # se publica incluso si las pruebas fallaron
        continue-on-error: true
        with:
          report_paths: 'target/surefire-reports/TEST-*.xml'
          check_name: 'Resultados · Pruebas unitarias'
          detailed_summary: true
          include_passed: true

      - name: Resumen en la pestaña Actions
        if: always()
        run: |
          echo "## Pruebas unitarias (JUnit 5)" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          FALLOS=$(grep -ho 'failures="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          ERRORES=$(grep -ho 'errors="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas ejecutadas | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Fallos | $FALLOS |" >> $GITHUB_STEP_SUMMARY
          echo "| Errores | $ERRORES |" >> $GITHUB_STEP_SUMMARY

      - name: Guardar resultados de las pruebas unitarias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas-unitarias
          path: target/surefire-reports/
          retention-days: 30

  # ===========================================================================
  # ETAPA 2 — Pruebas de aceptación BDD (Cucumber)
  # Solo se ejecuta si la etapa 1 pasó: no tiene sentido validar reglas de
  # negocio sobre un código que ya falló en lo básico.
  # ===========================================================================
  pruebas-bdd:
    name: 2 · Escenarios BDD (Cucumber)
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    timeout-minutes: 15

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Aqui NO se usa -DskipUnitTests: el reporte de cobertura debe combinar
      # lo que cubren las pruebas unitarias y los escenarios BDD, y para eso
      # ambos niveles tienen que correr en la misma ejecucion, escribiendo al
      # mismo archivo jacoco.exec. Repetir las unitarias cuesta decimas de
      # segundo; perder la mitad de la cobertura costaria mucho mas.
      - name: Ejecutar escenarios BDD y medir cobertura
        run: mvn -B -ntp verify

      - name: Generar reporte HTML navegable (Surefire y Failsafe)
        if: always()
        run: mvn -B -ntp site -DskipTests

      - name: Publicar resultados BDD como check del commit
        uses: mikepenz/action-junit-report@v5
        if: always()
        continue-on-error: true
        with:
          report_paths: 'target/cucumber-reports/cucumber-junit.xml'
          check_name: 'Resultados · Escenarios BDD'
          detailed_summary: true
          include_passed: true

      - name: Resumen BDD en la pestaña Actions
        if: always()
        run: |
          echo "## Escenarios BDD (Cucumber)" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -ho 'tests="[0-9]*"' target/cucumber-reports/cucumber-junit.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          FALLOS=$(grep -ho 'failures="[0-9]*"' target/cucumber-reports/cucumber-junit.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Escenarios ejecutados | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Escenarios fallidos | ${FALLOS:-0} |" >> $GITHUB_STEP_SUMMARY

      # La cobertura se publica junto al resto de las metricas: un numero que
      # hay que ir a buscar a un artefacto ZIP es un numero que nadie mira.
      - name: Publicar la cobertura en el resumen del pipeline
        if: always()
        run: |
          ARCHIVO=target/site/jacoco/jacoco.csv
          if [ ! -f "$ARCHIVO" ]; then
            echo "No se genero el reporte de cobertura." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Cobertura de código (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Cubierto | Total | Porcentaje | Umbral |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          node -e '
            const filas = require("fs").readFileSync("target/site/jacoco/jacoco.csv", "utf8")
              .trim().split("\n").slice(1).map(l => l.split(","));
            const suma = (i) => filas.reduce((t, f) => t + Number(f[i]), 0);
            const fila = (etiqueta, perdido, cubierto, umbral) => {
              const total = perdido + cubierto;
              if (!total) return;
              const pct = (cubierto * 100 / total).toFixed(1);
              console.log(`| ${etiqueta} | ${cubierto} | ${total} | ${pct} % | ${umbral} |`);
            };
            fila("Instrucciones", suma(3), suma(4), "80 %");
            fila("Ramas", suma(5), suma(6), "70 %");
            fila("Líneas", suma(7), suma(8), "—");
          ' >> $GITHUB_STEP_SUMMARY

      - name: Guardar reporte navegable de BDD
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-bdd-cucumber
          path: |
            target/cucumber-reports/
            target/site/
          retention-days: 30

  # ===========================================================================
  # ETAPA 3 — Prueba de performance (k6)
  # Corre en paralelo a la etapa BDD: ambas dependen de las unitarias, pero
  # no entre sí, así que no tiene sentido serializarlas.
  # ===========================================================================
  performance:
    name: 3 · Prueba de performance (k6)
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    timeout-minutes: 15

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js (servidor bajo prueba)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Levantar el servicio de login y esperar a que responda
        run: |
          mkdir -p performance/resultados
          node performance/servidor-mock.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8088/health > /dev/null; then
              echo "Servicio arriba tras $i intento(s)"; exit 0
            fi
            sleep 1
          done
          echo "El servicio no respondió a tiempo"; exit 1

      # Si algún umbral (p95, tasa de error, TPS) se incumple, k6 devuelve
      # código 99 y este paso rompe el build: el SLA es un quality gate.
      - name: Ejecutar la prueba de carga
        run: k6 run performance/login-carga.js

      - name: Publicar indicadores en el resumen del pipeline
        if: always()
        run: |
          echo "## Prueba de performance — POST /api/login" >> $GITHUB_STEP_SUMMARY
          if [ -f performance/resultados/indicadores.json ]; then
            node -e '
              const d = require("./performance/resultados/indicadores.json");
              const n = (x, k = 2) => Number(x).toFixed(k);
              const fila = (m, v, u, ok) =>
                `| ${m} | ${v} | ${u} | ${ok ? "✅ CUMPLE" : "❌ NO CUMPLE"} |`;
              console.log("| Indicador | Valor | Umbral | Resultado |");
              console.log("|---|---|---|---|");
              console.log(fila("Throughput (TPS)", n(d.tps) + " req/s", "> 5", d.tps > 5));
              console.log(fila("Latencia media", n(d.latencia_promedio_ms) + " ms", "< 400 ms", d.latencia_promedio_ms < 400));
              console.log(fila("Latencia p95", n(d.latencia_p95_ms) + " ms", "< 800 ms", d.latencia_p95_ms < 800));
              console.log(fila("Latencia p99", n(d.latencia_p99_ms) + " ms", "< 1500 ms", d.latencia_p99_ms < 1500));
              console.log(fila("Tasa de error", n(d.tasa_error * 100) + " %", "< 1 %", d.tasa_error < 0.01));
              console.log(fila("Checks funcionales", n(d.checks_ok * 100) + " %", "> 99 %", d.checks_ok > 0.99));
            ' >> $GITHUB_STEP_SUMMARY
          else
            echo "No se generaron indicadores: la prueba no alcanzó a completarse." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Guardar reporte de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-performance-k6
          path: performance/resultados/
          retention-days: 30

  # ===========================================================================
  # ETAPA 4 — Publicación del dashboard y los reportes navegables
  # Reúne los artefactos de las tres etapas anteriores en un único sitio
  # estático y lo publica en GitHub Pages, de modo que el equipo entre siempre
  # a la misma URL en lugar de descargar archivos ZIP desde Actions.
  # ===========================================================================
  publicar-dashboard:
    name: 4 · Publicar dashboard y reportes
    runs-on: ubuntu-latest
    needs: [ pruebas-unitarias, pruebas-bdd, performance ]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Recuperar los artefactos de todas las etapas
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Armar el sitio de reportes
        run: |
          set -euo pipefail
          mkdir -p sitio/bdd sitio/pruebas sitio/performance sitio/cobertura sitio/evidencias
          cp reportes/index.html sitio/index.html

          # upload-artifact toma como raiz el ancestro comun de las rutas
          # subidas: el artefacto de la etapa 2 llega con 'cucumber-reports/'
          # y 'site/' en su raiz, sin el prefijo 'target/'.
          cp -r artefactos/reporte-bdd-cucumber/cucumber-reports/*  sitio/bdd/
          cp -r artefactos/reporte-bdd-cucumber/site/*              sitio/pruebas/
          cp -r artefactos/reporte-bdd-cucumber/site/jacoco/*       sitio/cobertura/
          cp -r artefactos/reporte-performance-k6/*                 sitio/performance/
          # Las evidencias viajan en el propio repositorio, no en un artefacto:
          # el indice hace verificable que cada captura respalda lo que se afirma.
          cp -r docs/evidencias/*                                   sitio/evidencias/

          # Verificacion explicita: si un reporte no quedo publicado, el job
          # debe fallar. Un 404 silencioso es peor que un build en rojo.
          for esperado in sitio/index.html sitio/bdd/reporte-bdd.html \
                          sitio/pruebas/surefire.html sitio/pruebas/failsafe.html \
                          sitio/performance/reporte-performance.html \
                          sitio/cobertura/index.html \n                          sitio/evidencias/index.html; do
            if [ ! -f "$esperado" ]; then
              echo "::error::Falta el reporte esperado: $esperado"; exit 1
            fi
            echo "  ok  $esperado"
          done

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita Pages en el repositorio si aun no lo estaba, en lugar de fallar.
          enablement: true

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4

  # ===========================================================================
  # ETAPA 5 — Alertas automáticas
  # 'if: always()' es imprescindible: este job debe ejecutarse justamente
  # cuando algo falló, que es cuando los jobs anteriores quedan en 'failure'.
  # ===========================================================================
  alertas:
    name: 5 · Alertas automáticas
    runs-on: ubuntu-latest
    needs: [ pruebas-unitarias, pruebas-bdd, performance ]
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Evaluar el resultado global del pipeline
        id: estado
        run: |
          UNIT="${{ needs.pruebas-unitarias.result }}"
          BDD="${{ needs.pruebas-bdd.result }}"
          PERF="${{ needs.performance.result }}"
          echo "unit=$UNIT"  >> $GITHUB_OUTPUT
          echo "bdd=$BDD"    >> $GITHUB_OUTPUT
          echo "perf=$PERF"  >> $GITHUB_OUTPUT
          if [ "$UNIT" = "success" ] && [ "$BDD" = "success" ] && [ "$PERF" = "success" ]; then
            echo "global=success" >> $GITHUB_OUTPUT
          else
            echo "global=failure" >> $GITHUB_OUTPUT
          fi

      # --- A1/A2/A5: notificación a Slack ante cualquier fallo -----------------
      # Requiere el secreto SLACK_WEBHOOK_URL en Settings > Secrets and variables.
      - name: Alertar a Slack (pipeline fallido)
        if: steps.estado.outputs.global == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Sin SLACK_WEBHOOK_URL configurado: se omite la notificacion a Slack."; exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {
            "text": ":rotating_light: *Pipeline FALLIDO* en \`${{ github.ref_name }}\`",
            "blocks": [
              { "type": "section", "text": { "type": "mrkdwn",
                "text": "*Repositorio:* ${{ github.repository }}\n*Autor:* ${{ github.actor }}\n*Commit:* \`${{ github.sha }}\`" } },
              { "type": "section", "text": { "type": "mrkdwn",
                "text": "*Unitarias:* ${{ steps.estado.outputs.unit }}\n*BDD:* ${{ steps.estado.outputs.bdd }}\n*Performance:* ${{ steps.estado.outputs.perf }}" } },
              { "type": "actions", "elements": [
                { "type": "button", "text": { "type": "plain_text", "text": "Ver el run" },
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" } ] }
            ]
          }
          JSON

      # --- A3: main roto abre un incidente trazable ---------------------------
      - name: Abrir incidente si main quedó roto
        if: steps.estado.outputs.global == 'failure' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] main roto en el build #${context.runNumber}`,
              labels: ['ci', 'bloqueante'],
              body: [
                'El pipeline falló en la rama `main`, por lo que nadie puede desplegar.',
                '',
                `- **Commit:** ${context.sha}`,
                `- **Autor:** @${context.actor}`,
                `- **Unitarias:** ${{ steps.estado.outputs.unit }}`,
                `- **BDD:** ${{ steps.estado.outputs.bdd }}`,
                `- **Performance:** ${{ steps.estado.outputs.perf }}`,
                '',
                `[Ver el run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              ].join('\n')
            });

      # --- A9: comunicar también la recuperación ------------------------------
      - name: Registrar el resultado en el resumen del run
        if: always()
        run: |
          if [ "${{ steps.estado.outputs.global }}" = "success" ]; then
            echo "## ✅ Pipeline en verde" >> $GITHUB_STEP_SUMMARY
            echo "Unitarias, escenarios BDD y prueba de performance cumplieron todos sus umbrales." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🚨 Pipeline fallido — alerta emitida" >> $GITHUB_STEP_SUMMARY
            echo "| Etapa | Resultado |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Pruebas unitarias | ${{ steps.estado.outputs.unit }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Escenarios BDD | ${{ steps.estado.outputs.bdd }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Performance | ${{ steps.estado.outputs.perf }} |" >> $GITHUB_STEP_SUMMARY
          fi
